plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'java-library'
    id 'maven-publish'
}

group = rootProject.maven_group
version = rootProject.mod_version

base {
    archivesName = rootProject.archives_name
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        url "https://maven.su5ed.dev/releases"
    }

    maven {
        name = "FirstDark"
        url = uri("https://maven.firstdark.dev/snapshots")
    }
}

loom {
    silentMojangMappingsLicense()
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$rootProject.minecraft_version:$rootProject.parchment_version@zip")
    }
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${rootProject.minecraft_version}:${rootProject.ldlib2_version}:all"

    modImplementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:$rootProject.fabric_api_version+$rootProject.ffa_version+$rootProject.minecraft_version"

    minecraftRuntimeLibraries "org.appliedenergistics.yoga:yoga:${rootProject.yoga_version}"
    minecraftRuntimeLibraries "dev.vfyjxf:taffy:${rootProject.taffy_version}"
}


java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

jar {
    from("LICENSE") {
        rename {
            "${it}_${project.base.archivesName}"
        }
    }
}

// Configure Maven publishing.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.base.archivesName.toString()
            version = project.version.toString()

            artifact jar
            artifact remapJar
            artifact sourcesJar
        }
    }

    repositories {

    }
}
